version: 2

updates:
  - package-ecosystem: npm # also covers pnpm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The runtime is Node 24: keep its types on 24.x.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # astro check supports TypeScript 5 and 6; the move to 7 is done on purpose.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
