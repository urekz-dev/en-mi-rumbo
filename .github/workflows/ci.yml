name: CI

on:
  pull_request:
    # No edited: the title check lives in pr-title.yml, so description edits
    # do not re-run the full CI.
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  # Install without the git hooks that `vp config` sets up in `prepare`.
  VP_GIT_HOOKS: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check:all

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: enmirumbo
          POSTGRES_PASSWORD: enmirumbo
          POSTGRES_DB: enmirumbo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enmirumbo -d enmirumbo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests apply the migrations themselves in a global setup.
      DATABASE_URL: postgres://enmirumbo:enmirumbo@localhost:5432/enmirumbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp test

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: enmirumbo
          POSTGRES_PASSWORD: enmirumbo
          POSTGRES_DB: enmirumbo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enmirumbo -d enmirumbo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://enmirumbo:enmirumbo@localhost:5432/enmirumbo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: 24
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install --with-deps chromium
      # Builds first (dependsOn: build), then runs Playwright against astro preview.
      - run: vp run e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
