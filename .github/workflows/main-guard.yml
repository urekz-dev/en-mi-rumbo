name: main-guard
# Caller: copia este archivo a .github/workflows/main-guard.yml del repo. La lógica vive en urekz-dev/workflows (privado).
on:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    uses: urekz-dev/workflows/.github/workflows/main-guard.yml@main
    secrets: inherit
